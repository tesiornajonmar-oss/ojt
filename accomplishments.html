<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Accomplishments | OJT-ERAMS</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body data-portal="student">
  <div class="layout">
    <aside id="sidebar"></aside>
    <div class="main">
      <header id="topbar"></header>
      <section class="content">

        <div id="revBox"></div>
        <div class="page-head">
          <div><h2 class="page-title">Accomplishments</h2><p class="muted">Log what you accomplished with <b>photo evidence</b>. Your supervisor verifies each one, and you can attach them to your narrative reports.</p></div>
          <button class="btn btn-navy" id="newBtn" type="button">+ New accomplishment</button>
        </div>
        <div id="grid" class="acc-grid"></div>
        <p class="muted center" id="emptyNote" hidden>Nothing yet — add your first accomplishment with a photo.</p>
      </section>
    </div>
  </div>
  <script src="js/boot.js" data-page="js/accomplishments.js" data-with="widgets"></script>
</body>
</html>
